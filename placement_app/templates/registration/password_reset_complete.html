<!DOCTYPE html>
<html>
<head>
    <title>Password Reset Complete</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        .container { border: 1px solid #ddd; padding: 30px; border-radius: 10px; text-align: center; }
        .success { color: green; font-size: 50px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="success">🎉</div>
        <h2>Password Reset Complete!</h2>
        <p>Your password has been changed successfully. You can now login with your new password.</p>
        <br>
        <a href="{% url 'login' %}"><button>Login Now</button></a>
    </div>
</body>
</html>
