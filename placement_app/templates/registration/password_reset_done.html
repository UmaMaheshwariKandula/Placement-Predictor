<!DOCTYPE html>
<html>
<head>
    <title>Email Sent</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        .container { border: 1px solid #ddd; padding: 30px; border-radius: 10px; text-align: center; }
        .success { color: green; font-size: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="success">✅</div>
        <h2>Check Your Email</h2>
        <p>We've sent you an email with instructions to reset your password.</p>
        <p><a href="{% url 'login' %}">Return to Login</a></p>
    </div>
</body>
</html>
