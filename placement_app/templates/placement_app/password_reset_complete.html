{% extends 'placement_app/base.html' %}
{% load static %}

{% block content %}
<style>
    .reset-container {
        max-width: 450px;
        margin: 60px auto;
        padding: 40px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        text-align: center;
    }
    .reset-container .icon {
        font-size: 80px;
        margin-bottom: 20px;
    }
    .reset-container h2 {
        font-size: 28px;
        font-weight: 800;
        color: #1f2937;
        margin-bottom: 10px;
    }
    .reset-container p {
        color: #6b7280;
        margin-bottom: 20px;
    }
    .reset-container .btn-login {
        display: inline-block;
        padding: 12px 30px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
    }
    .reset-container .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
    }
</style>

<div class="reset-container">
    <div class="icon">✅</div>
    <h2>Password Reset Complete!</h2>
    <p>Your password has been successfully reset.</p>
    <a href="{% url 'login' %}" class="btn-login">Login Now</a>
</div>
{% endblock %}
