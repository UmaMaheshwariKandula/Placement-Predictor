{% extends 'placement_app/base.html' %}
{% load static %}

{% block content %}
<style>
    .reset-container {
        max-width: 450px;
        margin: 60px auto;
        padding: 40px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        text-align: center;
    }
    .reset-container .icon {
        font-size: 80px;
        margin-bottom: 20px;
    }
    .reset-container h2 {
        font-size: 28px;
        font-weight: 800;
        color: #1f2937;
        margin-bottom: 10px;
    }
    .reset-container p {
        color: #6b7280;
        margin-bottom: 20px;
    }
    .reset-container .back-link {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
    }
</style>

<div class="reset-container">
    <div class="icon">📧</div>
    <h2>Check Your Email</h2>
    <p>We've sent you a password reset link. Please check your email inbox.</p>
    <p style="font-size: 14px; color: #9ca3af;">If you don't see it, check your spam folder.</p>
    <a href="{% url 'login' %}" class="back-link">← Back to Login</a>
</div>
{% endblock %}
