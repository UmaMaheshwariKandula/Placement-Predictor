<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Success Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Light Mode (Default) */
        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-bg-solid: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border-color: #e5e7eb;
            --input-bg: #ffffff;
            --nav-bg: #ffffff;
            --table-header-bg: #f8fafc;
            --label-color: #374151;
            --heading-color: #1f2937;
        }
        
        /* Dark Mode */
        body.dark-mode {
            --bg-gradient-start: #0f0f1a;
            --bg-gradient-end: #1a1a2e;
            --card-bg: rgba(30, 30, 46, 0.95);
            --card-bg-solid: #1e1e2e;
            --text-primary: #f3f4f6;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #1f2937;
            --nav-bg: #1a1a2e;
            --table-header-bg: #1f2937;
            --label-color: #cbd5e1;
            --heading-color: #f3f4f6;
        }
        
        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            transition: all 0.3s ease;
            color: var(--text-primary);
        }
        
        /* Headings */
        h1, h2, h3, h4, h5, h6, .section-header {
            color: var(--heading-color) !important;
        }
        
        /* Labels */
        label, .block, .font-semibold {
            color: var(--label-color) !important;
        }
        
        /* Glassmorphism Cards */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            color: var(--text-primary);
        }
        
        /* Inner Cards */
        .bg-gray-50, .border-rounded, .company-card, .skill-card {
            background-color: var(--card-bg-solid) !important;
            color: var(--text-primary) !important;
        }
        
        /* Form Inputs */
        .form-input, select, textarea {
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
        }
        
        .form-input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        /* Placeholder Text */
        ::placeholder {
            color: var(--text-muted) !important;
            opacity: 0.7;
        }
        
        /* Dark Mode Toggle Button */
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 600;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        /* Navigation */
        nav {
            background: var(--nav-bg) !important;
            transition: all 0.3s ease;
        }
        
        /* Text Colors - ALL TEXT FIXED */
        .text-gray-600, .text-gray-500, .text-gray-400, .text-gray-700 {
            color: var(--text-secondary) !important;
        }
        
        .text-indigo-600, .text-indigo-700, .text-indigo-800 {
            color: #818cf8 !important;
        }
        
        .text-green-600, .text-green-500 {
            color: #34d399 !important;
        }
        
        .text-red-600, .text-red-500 {
            color: #f87171 !important;
        }
        
        .text-yellow-600, .text-yellow-500 {
            color: #fbbf24 !important;
        }
        
        .text-blue-600, .text-blue-700 {
            color: #60a5fa !important;
        }
        
        /* Borders */
        .border, .border-t, .border-b, .border-l, .border-r {
            border-color: var(--border-color) !important;
        }
        
        /* Tables */
        .data-table th {
            background: var(--table-header-bg);
            color: var(--text-primary);
        }
        
        .data-table td {
            border-bottom-color: var(--border-color);
            color: var(--text-primary);
        }
        
        /* Company Cards */
        .company-card {
            background: var(--card-bg-solid);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        
        .company-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        .company-card strong, .company-card p {
            color: var(--text-primary) !important;
        }
        
        /* Skill Cards */
        .skill-card {
            background: var(--card-bg-solid);
        }
        
        .skill-card p, .skill-card strong {
            color: var(--text-primary) !important;
        }
        
        /* Prediction Cards - Keep gradient but text white */
        .prediction-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 20px;
            color: white;
            text-align: center;
        }
        
        .prediction-card h3, .prediction-card p {
            color: white !important;
        }
        
        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }
        
        /* Links */
        a:not(.btn-primary):not(.theme-toggle) {
            color: #818cf8;
        }
        
        a:not(.btn-primary):not(.theme-toggle):hover {
            color: #a5b4fc;
        }
        
        /* Messages */
        .bg-red-100 {
            background-color: #7f1d1d !important;
            color: #fecaca !important;
        }
        
        .bg-green-100 {
            background-color: #064e3b !important;
            color: #a7f3d0 !important;
        }
        
        /* Scrollbar for Dark Mode */
        body.dark-mode::-webkit-scrollbar {
            width: 10px;
        }
        
        body.dark-mode::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        
        body.dark-mode::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <!-- Dark/Light Mode Toggle Button -->
    <button onclick="toggleTheme()" class="theme-toggle">
        <span id="theme-icon">🌙</span>
        <span id="theme-text">Dark Mode</span>
    </button>

    <nav class="shadow mb-6">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <span class="font-bold text-xl text-indigo-600">🎓 Placement Success AI System</span>
            {% if user.is_authenticated %}
            <div class="flex items-center space-x-4">
                <span class="text-gray-600">{{ user.username }}</span>
                <a href="{% url 'logout' %}" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Logout</a>
            </div>
            {% endif %}
        </div>
    </nav>
    
    <div class="container mx-auto px-4">
        {% block content %}
        {% endblock %}
    </div>

    <script>
        // Dark/Light Mode Toggle Function
        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');
            
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                themeIcon.innerHTML = '☀️';
                themeText.innerHTML = 'Light Mode';
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.innerHTML = '🌙';
                themeText.innerHTML = 'Dark Mode';
                localStorage.setItem('theme', 'light');
            }
        }
        
        // Load saved theme on page load
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('theme-icon').innerHTML = '☀️';
            document.getElementById('theme-text').innerHTML = 'Light Mode';
        }
    </script>
</body>
</html>
